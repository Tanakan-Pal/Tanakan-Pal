# Research City data. Edit this file to add buildings.
# Each item becomes part of a building in its year and category row.
# Add a new category by adding it under `categories` and using its name in `items`.

title: Tanakan Stats
total_label: achievements unlocked   # text after the total count
owner: Tanakan Paladkong

categories:            # order = rows from back to front
  - name: Publications
    color: "#f2cc60"
    unit: 34           # building height (px) per item
  - name: Presentations
    color: "#58a6ff"
    unit: 22
  - name: Projects
    color: "#3fb950"
    unit: 18
  - name: Grants & Awards
    color: "#bc8cff"
    unit: 26
  - name: Mentoring & Service
    color: "#ff7b72"
    unit: 14

