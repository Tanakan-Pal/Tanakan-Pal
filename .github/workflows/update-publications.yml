name: Update publications from ORCID

on:
  schedule:
    - cron: "17 1 * * 1"     # every Monday 08:17 Bangkok time
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild Publications section
        run: python scripts/update_publications.py
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "Publications already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Update publications from ORCID"
            git push
          fi
